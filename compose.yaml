# ATENEA service topology (phase 1).
#
# Today only the `agent` service is defined. The `indexer` and `postgres`
# service blocks are commented below as forward declarations for phase 3 —
# uncomment once the Python service exists. SQLite (audit/approvals/memory
# journal) stays embedded inside the agent process; vector storage uses
# Postgres + pgVector running as its own container.
#
# Typical invocation:
#   docker compose run --rm agent
#   docker compose run --rm agent --provider openai
#
# Required on the host: an `atenea.toml` at the project root and whichever
# provider API keys it references exported in the shell (or in a .env file).

name: atenea

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: atenea/agent:dev
    # Interactive REPL needs both a TTY and an attached stdin.
    stdin_open: true
    tty: true
    init: true
    working_dir: /work
    environment:
      # Provider credentials are resolved by atenea.toml via ${VAR} expansion.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ATENEA_HOME: /data
    volumes:
      # The project (and any target repos) live under /work.
      - ./:/work
      # Precious, rebuild-resistant state: sessions, approvals, audit log.
      - atenea-data:/data
    # No ports exposed — phase 3's indexer will use a Unix socket on the
    # shared `atenea-data` volume rather than TCP.

